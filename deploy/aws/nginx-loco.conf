# /etc/nginx/sites-available/loco.himinsights.in   (symlink into sites-enabled)
# One file per project/instance - nothing here is shared with emu.himinsights.in.
server {
    listen 80;
    listen [::]:80;
    server_name loco.himinsights.in;

    client_max_body_size 5m;

    location / {
        proxy_pass         http://127.0.0.1:3100;     # PM2 app listens on 3100 (see ecosystem.config.js)
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
